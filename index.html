<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity Water Landing Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header: Logo and links for following or supporting charity: water -->
    <header class="hero">
        <img src="img/cw_logo_WhiteText.png" alt="charity: water" class="hero-logo">
        <nav class="hero-actions" aria-label="Support charity: water">
            <a href="https://www.instagram.com/charitywater/" class="hero-button follow-button">Follow</a>
            <a href="https://www.charitywater.org/donate" class="hero-button give-button">Give</a>
        </nav>
    </header>

    <!-- Hero image and headline -->
    <section class="hero-banner" aria-labelledby="hero-title">
        <div class="hero-content">
            <p class="hero-eyebrow">FOR THE NEXT GENERATION OF CHANGEMAKERS</p>
            <p class="hero-subtext">Give in seconds, and follow the story of the people you help.</p>
            <h1 class="hero-title" id="hero-title">
                <span>Small gifts bring</span>
                <span>clean water closer.</span>
            </h1>
        </div>
    </section>
</body>
</html>
